<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Saved Target Step</title>
<link rel="stylesheet" href="pi.css">
</head>
<body>
<div class="pi">
  <div class="row">
    <label for="direction">Direction</label>
    <select id="direction" data-setting="direction" data-default="next">
      <option value="next">Next target</option>
      <option value="prev">Previous target</option>
    </select>
  </div>
  <p class="hint">Restores the next or previous entry from the app's saved-targets list, including its saved artillery position when one was stored.</p>
</div>
<script src="pi.js"></script>
</body>
</html>
