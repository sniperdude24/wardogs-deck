[package]
name = "wardogs-deck"
version = "0.1.0"
description = "WARDOGS artillery calculator desktop app with a local API for the Stream Deck plugin"
authors = ["David Wallace"]
license = "MIT"
edition = "2021"

[lib]
name = "wardogs_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time", "sync", "net", "rt"] }
axum = "0.7"
